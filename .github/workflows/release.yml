name: Build, Test & Release

# This repo (VsAcp-private) is mirrored verbatim to the public VsAcp repo
# (see .vscode/Mirror.ps1), so this file lives there too. Two ways in:
#  - "Run workflow": build and test, optionally release by hand - works in
#    either repo.
#  - A push to main: build, test and, if the Identity Version in
#    source.extension.vsixmanifest has no release yet (no v<version> tag),
#    release it automatically, with the version number as the only release
#    notes. Automatic only in the public repo (PUBLIC_REPO below) - a push to
#    VsAcp-private's main does nothing, since every push there is mirrored
#    on to the public repo's main anyway, which then runs this for real.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'Also create a GitHub Release with the built VSIX, using the version already in source.extension.vsixmanifest. Leave unchecked to only build and test.'
        required: false
        type: boolean
        default: false
      release_notes:
        description: 'Release notes (used only when "release" is checked). Empty = the version number.'
        required: false
        type: string
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Check: decides what this run does. Manual runs always build; "release"
  # follows the input. A push builds and releases only when the manifest
  # version has no v<version> tag yet.
  # ---------------------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    name: Check version

    outputs:
      version: ${{ steps.decide.outputs.version }}
      build: ${{ steps.decide.outputs.build }}
      release: ${{ steps.decide.outputs.release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Decide
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          # The Identity element spans several lines, so parse the XML.
          VERSION=$(pwsh -NoProfile -Command '([xml](Get-Content src/VsAcp/source.extension.vsixmanifest -Raw)).PackageManifest.Metadata.Identity.Version')
          if [ -z "$VERSION" ]; then
            echo "Could not read the Identity Version from source.extension.vsixmanifest." >&2
            exit 1
          fi
          PUBLIC_REPO="samartzidis/VsAcp"
          BUILD=true
          RELEASE=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            RELEASE="$RELEASE_INPUT"
          elif [ "$EVENT" = "push" ] && [ "$REPO" != "$PUBLIC_REPO" ]; then
            echo "Push trigger only runs automatically in $PUBLIC_REPO; skipping on $REPO (use \"Run workflow\" to build here by hand)."
            BUILD=false
          elif gh api "repos/$REPO/git/refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released - nothing to do."
            BUILD=false
          else
            echo "v$VERSION has no release yet - building and releasing it."
            RELEASE=true
          fi
          {
            echo "version=$VERSION"
            echo "build=$BUILD"
            echo "release=$RELEASE"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Test: builds (as a side effect) and runs the Core test suite.
  # ---------------------------------------------------------------------------
  test:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    name: Test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: dotnet test
        run: dotnet test tests/VsAcp.Core.Tests -c Release --verbosity normal

  # ---------------------------------------------------------------------------
  # Web test: the Preact/TypeScript chat UI's own suites. The e2e suite
  # (template.test.mjs, banners, ...) exercises the real built bundle driven
  # through headless Edge (playwright-core, channel "msedge" - the
  # windows-latest image ships Edge, so no browser download is needed), so
  # the bundle has to be built first.
  # ---------------------------------------------------------------------------
  web-test:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    name: Web test

    defaults:
      run:
        working-directory: src/VsAcp/Web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'

      - name: npm ci
        run: npm ci

      - name: Build bundle (needed by the e2e suite)
        run: npm run build

      - name: npm test (vitest)
        run: npm test

      - name: npm run test:e2e
        run: npm run test:e2e

  # ---------------------------------------------------------------------------
  # Pack: build the VSIX in Release. The extension's Identity Version
  # (source.extension.vsixmanifest) is the single source of truth - no tag
  # or version is typed in by hand; the release tag (when releasing) is
  # derived from it.
  # ---------------------------------------------------------------------------
  pack:
    needs: [check, test, web-test]
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    name: Pack

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content src/VsAcp/source.extension.vsixmanifest
          $version = $manifest.PackageManifest.Metadata.Identity.Version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Fail if this version was already released
        if: needs.check.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh api "repos/${{ github.repository }}/git/refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists - bump the Identity Version in source.extension.vsixmanifest before releasing." >&2
            exit 1
          fi

      - name: Build VSIX (Release)
        run: dotnet build VsAcp.slnx --configuration Release

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: src/VsAcp/bin/Release/net472/VsAcp.vsix
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Release: create the GitHub Release (tag derived from the version above,
  # created automatically since it doesn't exist yet) and attach the VSIX -
  # only when the check job decided to release. Release notes: the typed
  # input of a manual run, else just the version number.
  # ---------------------------------------------------------------------------
  release:
    needs: [check, pack]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    name: Release
    permissions:
      contents: write   # to create the GitHub Release

    env:
      TAG: v${{ needs.pack.outputs.version }}

    steps:
      - name: Download VSIX
        uses: actions/download-artifact@v8
        with:
          name: vsix
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: Release ${{ env.TAG }}
          files: dist/*
          body: ${{ inputs.release_notes || needs.pack.outputs.version }}
